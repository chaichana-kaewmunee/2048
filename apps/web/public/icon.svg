<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1c"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ed8eb"/>
      <stop offset="50%" stop-color="#8a65ff"/>
      <stop offset="100%" stop-color="#ff527d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#2a3d61" stroke-width="4"/>
  <g filter="url(#glow)">
    <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="url(#neon)" text-anchor="middle" letter-spacing="4">2048</text>
    <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#8ff7ff" text-anchor="middle" letter-spacing="8">NEON FUSION</text>
  </g>
</svg>
